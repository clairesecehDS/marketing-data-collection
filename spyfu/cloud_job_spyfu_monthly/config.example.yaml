    page_size: 50   # 13 domaines × 50 = 650 lignes
    sort_by: "SearchVolume"
    filters:
      min_search_volume: 50

  # Lost Clicks
  lost_clicks:
    enabled: true
    page_size: 50   # 13 domaines × 50 = 650 lignes
    sort_by: "SearchVolume"
