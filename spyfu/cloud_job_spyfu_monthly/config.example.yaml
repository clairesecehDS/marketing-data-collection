  # ============================================================
  # SCRIPTS - pageSize fixe à 50 pour tous
  # ============================================================
  # 12 scripts × 13 domaines × 50 lignes = ~7 800 lignes
  # Budget confortable avec marge de sécurité (2200 lignes)
  # ============================================================
  
  # PPC Keywords
  ppc_keywords:
    enabled: true
    page_size: 50   # 13 domaines × 50 = 650 lignes
    sort_by: "SearchVolume"
    filters:
      min_search_volume: 100

  # SEO Keywords
  seo_keywords:
    enabled: true
    page_size: 50   # 13 domaines × 50 = 650 lignes
    search_type: "MostValuable"
    sort_by: "SearchVolume"
    filters:
      min_search_volume: 100
      min_seo_clicks: 10

  # Newly Ranked
  newly_ranked:
    enabled: true
